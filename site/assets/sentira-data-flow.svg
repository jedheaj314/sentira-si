<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title description">
  <title id="title">From business context to operational AI</title>
  <desc id="description">Data, workflows and knowledge flow through an AI system into production, better decisions and team capability. Moving signals illustrate connected operations.</desc>
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#4f7cf0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#4f7cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x2="1" y2="1">
      <stop stop-color="#182b48"/>
      <stop offset="1" stop-color="#101725"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r=".7" fill="#98a2b4" opacity=".16"/>
    </pattern>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .label { fill: #edf0f6; font-size: 14px; font-weight: 500; }
      .small { fill: #98a2b4; font-size: 11px; letter-spacing: 1.6px; }
      .wire { fill: none; stroke: #30415d; stroke-width: 1.5; }
      .packet { fill: none; stroke: #5bb8d6; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 5 195; animation: carry 5s linear infinite; }
      .later { animation-delay: -1.7s; }
      .latest { animation-delay: -3.4s; }
      .return { stroke: #4f7cf0; stroke-dasharray: 4 196; animation-duration: 8s; }
      @keyframes carry { to { stroke-dashoffset: -200; } }
      @media (prefers-reduced-motion: reduce) { .packet { animation: none; } }
    </style>
  </defs>
  <rect x="16" y="16" width="608" height="528" rx="24" fill="#0a0e16"/>
  <rect x="16" y="16" width="608" height="528" rx="24" fill="url(#grid)"/>
  <ellipse cx="320" cy="272" rx="230" ry="220" fill="url(#halo)"/>
  <text x="44" y="62" class="small">CONNECTED INTELLIGENCE</text>
  <circle cx="575" cy="58" r="3" fill="#5bb8d6"/>
  <text x="44" y="120" class="small">BUSINESS CONTEXT</text>
  <text x="440" y="120" class="small">INTO OPERATION</text>
  <g class="wire">
    <path d="M186 187 H218 Q234 187 234 203 V248 Q234 264 254 264" pathLength="200"/>
    <path d="M186 275 H254" pathLength="200"/>
    <path d="M186 363 H218 Q234 363 234 347 V302 Q234 286 254 286" pathLength="200"/>
    <path d="M386 264 Q406 264 406 248 V203 Q406 187 422 187 H440" pathLength="200"/>
    <path d="M386 275 H440" pathLength="200"/>
    <path d="M386 286 Q406 286 406 302 V347 Q406 363 422 363 H440" pathLength="200"/>
    <path d="M510 388 V420 Q510 438 492 438 H148 Q130 438 130 420 V388" pathLength="200"/>
  </g>
  <g>
    <path class="packet" d="M186 187 H218 Q234 187 234 203 V248 Q234 264 254 264" pathLength="200"/>
    <path class="packet later" d="M186 275 H254" pathLength="200"/>
    <path class="packet latest" d="M186 363 H218 Q234 363 234 347 V302 Q234 286 254 286" pathLength="200"/>
    <path class="packet" d="M386 264 Q406 264 406 248 V203 Q406 187 422 187 H440" pathLength="200"/>
    <path class="packet later" d="M386 275 H440" pathLength="200"/>
    <path class="packet latest" d="M386 286 Q406 286 406 302 V347 Q406 363 422 363 H440" pathLength="200"/>
    <path class="packet return" d="M510 388 V420 Q510 438 492 438 H148 Q130 438 130 420 V388" pathLength="200"/>
  </g>
  <g fill="#111725" stroke="#26334a">
    <rect x="44" y="162" width="142" height="50" rx="10"/>
    <rect x="44" y="250" width="142" height="50" rx="10"/>
    <rect x="44" y="338" width="142" height="50" rx="10"/>
    <rect x="440" y="162" width="156" height="50" rx="10"/>
    <rect x="440" y="250" width="156" height="50" rx="10"/>
    <rect x="440" y="338" width="156" height="50" rx="10"/>
  </g>
  <g fill="none" stroke="#5bb8d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M63 180 H77 V194 H63 Z M63 185 H77 M68 185 V194"/>
    <path d="M63 270 H69 V276 H63 Z M71 279 H77 V285 H71 Z M69 273 H74 V279"/>
    <path d="M64 354 H74 L78 358 V372 H64 Z M74 354 V359 H78 M68 364 H74 M68 368 H73"/>
    <path d="M458 181 L470 187 L458 193 Z"/>
    <path d="M458 280 L463 275 L467 277 L474 269 M469 269 H474 V274"/>
    <path d="M458 363 L463 368 L474 357"/>
  </g>
  <g class="label">
    <text x="88" y="192">Data</text>
    <text x="88" y="280">Workflows</text>
    <text x="88" y="368">Knowledge</text>
    <text x="484" y="192">Production</text>
    <text x="484" y="280">Decisions</text>
    <text x="484" y="368">Capability</text>
  </g>
  <rect x="246" y="209" width="148" height="132" rx="24" fill="none" stroke="#4f7cf0" stroke-opacity=".18"/>
  <rect x="254" y="217" width="132" height="116" rx="18" fill="url(#core)" stroke="#5bb8d6" stroke-opacity=".5"/>
  <g fill="none" stroke="#5bb8d6" stroke-width="1.5">
    <path d="M307 249 L320 241 L333 249 V265 L320 273 L307 265 Z M307 249 L320 257 L333 249 M320 257 V273"/>
  </g>
  <text x="320" y="294" text-anchor="middle" fill="#edf0f6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Operational AI</text>
  <text x="320" y="310" text-anchor="middle" fill="#98a2b4" font-family="Inter, Arial, sans-serif" font-size="8" letter-spacing=".8">BUILT AROUND</text>
  <text x="320" y="322" text-anchor="middle" fill="#98a2b4" font-family="Inter, Arial, sans-serif" font-size="8" letter-spacing=".8">YOUR BUSINESS</text>
  <rect x="236" y="427" width="168" height="22" rx="11" fill="#0a0e16"/>
  <text x="320" y="442" text-anchor="middle" class="small" style="font-size:9px;letter-spacing:1.3px">CONTINUOUS IMPROVEMENT</text>
  <path d="M44 482 H596" stroke="#26334a"/>
  <text x="44" y="513" class="small" style="font-size:10px;letter-spacing:1px">STRATEGY</text>
  <text x="264" y="513" class="small" style="font-size:10px;letter-spacing:1px">ENGINEERING</text>
  <text x="524" y="513" class="small" style="font-size:10px;letter-spacing:1px">ADOPTION</text>
</svg>
